services:
  postgres:
    image: postgres:17
    container_name: northforge-finance-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - northforge_finance_db:/var/lib/postgresql/data

volumes:
  northforge_finance_db:
